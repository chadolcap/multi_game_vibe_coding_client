  <ellipse cx="64" cy="124" rx="19" ry="33" transform="rotate(-18 64 124)" fill="url(#skin)" stroke="#c98656" stroke-width="4.5"/>
  <!-- 얼굴 -->
  <ellipse cx="94" cy="148" rx="9" ry="5.5" fill="#ff9aa2" opacity="0.7"/>
  <ellipse cx="148" cy="148" rx="9" ry="5.5" fill="#ff9aa2" opacity="0.7"/>
  <circle cx="108" cy="134" r="5.5" fill="#3b2a20"/>
  <circle cx="134" cy="134" r="5.5" fill="#3b2a20"/>
  <circle cx="110" cy="132" r="1.8" fill="#ffffff"/>
  <circle cx="136" cy="132" r="1.8" fill="#ffffff"/>
  <path d="M114 146 q7 7 14 0" fill="none" stroke="#3b2a20" stroke-width="3" stroke-linecap="round"/>
