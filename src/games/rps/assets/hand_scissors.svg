<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 손 실루엣: 두 번 그려(굵은 외곽선 → 살색 채우기) 겹친 도형 사이에 선이 생기지 않게 한다. -->
    <g id="s">
      <rect x="52" y="104" width="106" height="78" rx="38"/>
      <rect x="64" y="22" width="27" height="104" rx="13.5" transform="rotate(-15 77 122)"/>
      <rect x="107" y="18" width="27" height="108" rx="13.5" transform="rotate(15 120 122)"/>
      <circle cx="136" cy="108" r="17"/>
      <circle cx="154" cy="120" r="15"/>
    </g>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6d0"/>
      <stop offset="1" stop-color="#ffcfaa"/>
    </linearGradient>
  </defs>
  <use xlink:href="#s" href="#s" fill="#c98656" stroke="#c98656" stroke-width="9" stroke-linejoin="round"/>
  <use xlink:href="#s" href="#s" fill="url(#skin)"/>
  <!-- 손톱 -->
  <ellipse cx="54" cy="38" rx="7" ry="5.5" transform="rotate(-15 54 38)" fill="#fff3ea"/>
  <ellipse cx="144" cy="35" rx="7" ry="5.5" transform="rotate(15 144 35)" fill="#fff3ea"/>
  <!-- 접은 손가락 마디 -->
  <path d="M128 104 q12 -4 22 6 M146 118 q8 0 14 8" fill="none" stroke="#d99a6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 엄지 -->
  <ellipse cx="68" cy="136" rx="18" ry="29" transform="rotate(-25 68 136)" fill="url(#skin)" stroke="#c98656" stroke-width="4.5"/>
  <!-- 얼굴 -->
  <ellipse cx="94" cy="162" rx="9" ry="5.5" fill="#ff9aa2" opacity="0.7"/>
  <ellipse cx="146" cy="162" rx="9" ry="5.5" fill="#ff9aa2" opacity="0.7"/>
  <circle cx="107" cy="148" r="5.5" fill="#3b2a20"/>
  <circle cx="133" cy="148" r="5.5" fill="#3b2a20"/>
  <circle cx="109" cy="146" r="1.8" fill="#ffffff"/>
  <circle cx="135" cy="146" r="1.8" fill="#ffffff"/>
  <path d="M113 160 q7 7 14 0" fill="none" stroke="#3b2a20" stroke-width="3" stroke-linecap="round"/>
</svg>
