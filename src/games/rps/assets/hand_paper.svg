<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 손 실루엣: 두 번 그려(굵은 외곽선 → 살색 채우기) 겹친 도형 사이에 선이 생기지 않게 한다. -->
    <g id="s">
      <rect x="50" y="98" width="98" height="84" rx="40"/>
      <rect x="42" y="68" width="24" height="60" rx="12" transform="rotate(-20 54 126)"/>
      <rect x="68" y="40" width="25" height="80" rx="12.5" transform="rotate(-7 80 118)"/>
