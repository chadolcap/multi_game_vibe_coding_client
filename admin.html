<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 페이지</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 17px;
        margin-top: 32px;
      }
      section {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        margin-top: 16px;
      }
      input,
      select,
      button {
        font-size: 14px;
        padding: 6px 10px;
        margin-right: 8px;
      }
      button {
        cursor: pointer;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 12px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 6px 10px;
        text-align: left;
        font-size: 13px;
      }
      #login-status,
      #channel-user-total,
      #notice-status {
        margin-left: 8px;
        font-size: 13px;
        color: #555;
      }
      .field-row {
        margin-top: 10px;
      }
      .field-row label {
        margin-right: 16px;
        font-size: 14px;
      }
      #notice-message {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 8px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>관리자 페이지</h1>

    <section id="login-section">
      <h2>로그인</h2>
      <!-- form 으로 감싸고 submit 이벤트를 써야 브라우저가 "비밀번호 저장" 여부를 물어본다. -->
      <form id="login-form">
        <input id="admin-id" type="text" placeholder="아이디" autocomplete="username" />
        <input id="admin-password" type="password" placeholder="비밀번호" autocomplete="current-password" />
        <button id="login-button" type="submit">로그인</button>
        <span id="login-status"></span>
      </form>
    </section>

    <section id="main-section" hidden>
      <h2>게임 선택</h2>
      <select id="game-select">
        <option value="rps">가위바위보</option>
        <option value="othello">오델로</option>
      </select>

      <h2>전체 채널 정보</h2>
      <button id="channel-count-button">전체 채널 정보 조회</button>
      <table>
        <thead>
          <tr>
            <th>채널</th>
            <th>접속자 수</th>
          </tr>
        </thead>
        <tbody id="channel-count-body"></tbody>
      </table>

      <h2>특정 채널 유저 정보</h2>
      <select id="channel-type-select">
        <option value="lobby">lobby</option>
        <option value="game">게임 채널 (위에서 선택한 게임)</option>
      </select>
      <input id="channel-no-input" type="number" min="1" value="1" style="width: 60px" />
      <button id="channel-user-button">채널 유저 정보 조회</button>
      <span id="channel-user-total"></span>
      <table>
        <thead>
          <tr>
            <th>userid</th>
            <th>room</th>
          </tr>
        </thead>
        <tbody id="channel-user-body"></tbody>
      </table>

      <h2>공지 전송</h2>
      <div class="field-row">
        <label>날짜 <input id="notice-date" type="date" /></label>
        <label>시작 시간 <input id="notice-start-time" type="time" step="600" /></label>
        <label>종료 시간 <input id="notice-end-time" type="time" step="600" /></label>
      </div>
      <div class="field-row">
        <span>보낼 채널:</span>
        <label><input type="checkbox" class="notice-channel" value="lobby_1" checked /> lobby_1</label>
        <label><input type="checkbox" class="notice-channel" value="lobby_2" checked /> lobby_2</label>
        <label><input type="checkbox" class="notice-channel" value="rps_1" checked /> rps_1</label>
        <label><input type="checkbox" class="notice-channel" value="rps_2" checked /> rps_2</label>
        <label><input type="checkbox" class="notice-channel" value="othello_1" checked /> othello_1</label>
      </div>
      <div class="field-row">
        <textarea id="notice-message" rows="3" placeholder="공지 내용을 입력하세요"></textarea>
      </div>
      <div class="field-row">
        <button id="notice-send-button">공지 전송</button>
        <span id="notice-status"></span>
      </div>
    </section>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
